<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trivia Quiz</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        h1, h2 { color: #2c3e50; }
        .error { color: red; }
    </style>
</head>
<body>

<h1>Welcome to the Trivia Quiz!</h1>
<div id="greeting"></div>
<div id="quote"></div>
<div id="trivia"></div>

<script>
    // Function to display current date and time
    function displayDate() {
        const now = new Date();
        const options = { year: 'numeric', month: 'long', day: 'numeric', weekday: 'long', hour: '2-digit', minute: '2-digit', second: '2-digit' };
        const dateStr = now.toLocaleString('en-US', options);
        document.body.insertAdjacentHTML('beforeend', `<p>Current Date and Time: ${dateStr}</p>`);
    }

    // Function for greeting based on time
    function personalizeGreeting() {
        const name = prompt("Please enter your name:");
        const capitalizedName = capitalizeFirstLetter(name);
        const now = new Date();
        let greeting;

        const hours = now.getHours();
        switch (true) {
            case (hours < 12):
                greeting = `Good Morning, ${capitalizedName}!`;
                break;
            case (hours < 17):
                greeting = `Good Afternoon, ${capitalizedName}!`;
                break;
            default:
                greeting = `Good Evening, ${capitalizedName}!`;
        }

        document.getElementById('greeting').innerText = greeting;
    }

    // Function to capitalize the first letter of a name
    function capitalizeFirstLetter(name) {
        return name.charAt(0).toUpperCase() + name.slice(1);
    }

    // Function to validate email
    function validateEmail() {
        let email;
        const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

        do {
            email = prompt("Please enter your email address:");
            if (!emailRegex.test(email)) {
                alert("Invalid email address. Please try again.");
            }
        } while (!emailRegex.test(email));

        const [username, domain] = email.split('@');
        const upperUsername = username.toUpperCase();
        document.body.insertAdjacentHTML('beforeend', `<p>Username: ${upperUsername}</p><p>Domain: ${domain}</p>`);
    }

    // Function to generate quote of the day
    function displayQuoteOfTheDay() {
        const quotes = [
            "The best way to predict the future is to create it.",
            "Life is 10% what happens to us and 90% how we react to it.",
            "The purpose of our lives is to be happy.",
            "Get busy living or get busy dying.",
            "You only live once, but if you do it right, once is enough."
        ];
        const randomIndex = Math.floor(Math.random() * quotes.length);
        document.getElementById('quote').innerText = `Quote of the Day: "${quotes[randomIndex]}"`;
    }

    // Placeholder for trivia quiz function
    function triviaQuiz() {
        // Add your trivia quiz logic here
        // Calculate score and total, then display it.
        // For example, score: 7 and total: 9
        const score = 7; // Replace with actual scoring logic
        const total = 9;
        const percentage = (score / total * 100).toFixed(2);
        document.getElementById('trivia').innerText = `Your Score: ${score}/${total} (${percentage}%)`;
    }

    // Main script execution
    displayDate();
    personalizeGreeting();
    validateEmail();
    displayQuoteOfTheDay();
    triviaQuiz();

</script>

</body>
</html>
